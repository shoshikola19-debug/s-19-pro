name: Rename s-19-pro.html to index.html
on:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename s-19-pro.html to index.html
        run: |
          ls -la
          if [ -f index.html ]; then echo "index.html already exists, nothing to do"; exit 0; fi
          if [ ! -f s-19-pro.html ]; then echo "s-19-pro.html not found"; exit 1; fi
          git mv s-19-pro.html index.html
          git config user.name "shoshikola19-debug"
          git config user.email "shoshikola19-debug@users.noreply.github.com"
          git commit -m "Rename s-19-pro.html to index.html"
          git push
          ls -lh index.html
